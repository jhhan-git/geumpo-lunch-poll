<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>금포식당 메뉴 조사</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column — header, 2x2 menu cards (photo + vote), live tally below */
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --fg: #1f2420;
  --muted: #6a716b;
  --line: #dde0da;
  --accent: #a2581c;
  --accent-soft: #f4e6d8;
  --photo-bg: #e7e9e3;
  --display: "Gowun Batang", "Noto Serif KR", serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161917; --surface: #1f2320; --fg: #e9ebe6; --muted: #9aa19b; --line: #333833;
    --accent: #e09a5c; --accent-soft: #3a2a1d; --photo-bg: #2a2f2b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161917; --surface: #1f2320; --fg: #e9ebe6; --muted: #9aa19b; --line: #333833;
  --accent: #e09a5c; --accent-soft: #3a2a1d; --photo-bg: #2a2f2b; color-scheme: dark;
}
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 32px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 28px; }
header { display: grid; gap: 6px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--accent); font-weight: 600; }
h1 { font-family: var(--display); font-size: clamp(26px, 6vw, 34px); line-height: 1.25; margin: 0; text-wrap: balance; }
h2 { font-family: var(--display); font-size: 20px; margin: 0; }
.lede { color: var(--muted); margin: 0; max-width: 60ch; }
.status { font-size: 13px; color: var(--muted); min-height: 1.4em; }
.status.warn { color: var(--accent); }

.me { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 520px) { .me { grid-template-columns: 1fr; } }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 13px; font-weight: 600; }
.field label em { font-style: normal; color: var(--accent); }
.field input { font: 400 15px var(--body); padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); min-width: 0; }
.field input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.field input.missing { border-color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: border-color .15s, box-shadow .15s; }
.card.mine { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.photo { position: relative; aspect-ratio: 4 / 3; width: 100%; max-width: 100%; overflow: hidden; flex: none; background: var(--photo-bg); display: grid; place-items: center; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .ph { font-family: var(--display); font-size: 40px; color: var(--muted); opacity: .5; }
.photo .ph.none { font-size: 34px; }
.body { position: relative; z-index: 1; background: var(--surface); padding: 14px 16px 16px; display: grid; gap: 10px; flex: 1; align-content: space-between; }
.name { font-weight: 600; font-size: 16px; margin: 0; }
.sub { font-size: 13px; color: var(--muted); margin: 0; }
.vote { font: 600 14px var(--body); padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
.vote:hover:not(:disabled) { background: var(--accent-soft); }
.card.mine .vote { background: var(--accent); color: var(--surface); }
.vote:disabled { opacity: .5; cursor: default; }

.tally { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 20px; display: grid; gap: 16px; }
.tally-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.total { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.row { display: grid; gap: 6px; }
.row-top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.row-top b { font-weight: 600; }
.count { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.bar { height: 8px; border-radius: 4px; background: var(--photo-bg); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .3s; }
.who { font-size: 12.5px; color: var(--muted); min-height: 1em; }
.linkbtn { font: 500 13px var(--body); color: var(--muted); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; justify-self: start; }
footer { font-size: 12.5px; color: var(--muted); }
footer a { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <span class="eyebrow">워크숍 출발 전 점심 · 공항 근처</span>
    <h1>금포식당에서 뭐 드실래요?</h1>
    <p class="lede">미리 메뉴를 정해 두면 도착하자마자 주문할 수 있어요. 하나를 고르고, 바꾸고 싶으면 다른 메뉴를 누르면 됩니다.</p>
    <div class="status" id="status">불러오는 중…</div>
  </header>

  <section class="me" aria-label="내 정보">
    <div class="field"><label for="dept">소속 <em>*</em></label><input id="dept" maxlength="30" placeholder="예: 00학교" autocomplete="organization"></div>
    <div class="field"><label for="pname">성명 <em>*</em></label><input id="pname" maxlength="20" placeholder="예: 홍길동" autocomplete="name"></div>
  </section>

  <section class="grid" id="grid" aria-label="메뉴 선택"></section>

  <section class="tally" aria-label="현재 집계">
    <div class="tally-head"><h2>현재 집계</h2><span class="total" id="total">0명 응답</span></div>
    <div id="rows" style="display:grid;gap:14px"></div>
    <button class="linkbtn" id="clear" hidden>내 선택 취소</button>
  </section>

  <footer>메뉴 정보: <a href="https://map.naver.com/p/entry/place/2047829430" target="_blank" rel="noopener">네이버 지도 · 금포식당</a></footer>
</div>


<script>
// Supabase 연결 정보 (anon/publishable 키는 공개되어도 되는 키입니다)
const SUPABASE_URL = "https://qipuagaqzvwghxuvulgr.supabase.co";
const SUPABASE_KEY = "sb_publishable_DXM8lm6acAEJ0HBpBi-Fnw_GWzjE2qf";

const MENUS = [
  { key: "doenjang", name: "소고기 서리태 된장찌개", sub: "서리태로 끓인 구수한 된장찌개", photo: "images/doenjang.png" },
  { key: "sundubu", name: "소고기 해물 순두부찌개", sub: "소고기와 해물이 들어간 얼큰한 순두부", photo: "images/sundubu.png" },
  { key: "donkatsu", name: "클래식 왕돈까스", sub: "큼직한 옛날식 돈까스", photo: "images/donkatsu.png" },
  { key: "none", name: "해당사항 없음", sub: "식사를 하지 않아요", mark: "—" },
];
const state = { votes: [], ready: false, busy: false };
const $ = (id) => document.getElementById(id);
function setStatus(msg, warn) { const s = $("status"); s.textContent = msg; s.classList.toggle("warn", !!warn); }

// 이 브라우저를 구분하는 번호. 같은 기기·브라우저에서 다시 열면 내 투표를 이어서 고칠 수 있어요.
const VOTER_KEY = "geumpo-voter-id";
let voterId = null;
try { voterId = localStorage.getItem(VOTER_KEY); } catch {}
if (!voterId) {
  voterId = crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) => (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16));
  try { localStorage.setItem(VOTER_KEY, voterId); } catch {}
}

async function rpc(fn, args) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(args),
  });
  if (!res.ok) throw new Error(`${fn} ${res.status}`);
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

const mine = () => state.votes.find((v) => v.mine);

function render() {
  const myChoice = mine()?.choice;
  $("grid").replaceChildren(...MENUS.map((m) => {
    const card = document.createElement("article");
    card.className = "card" + (myChoice === m.key ? " mine" : "");
    const photo = document.createElement("div");
    photo.className = "photo";
    if (m.photo) {
      const img = document.createElement("img");
      img.src = m.photo; img.alt = m.name; img.loading = "lazy";
      photo.append(img);
    } else {
      const ph = document.createElement("span");
      ph.className = "ph none"; ph.textContent = m.mark;
      photo.append(ph);
    }
    const body = document.createElement("div");
    body.className = "body";
    const txt = document.createElement("div");
    const h = document.createElement("p"); h.className = "name"; h.textContent = m.name;
    const s = document.createElement("p"); s.className = "sub"; s.textContent = m.sub;
    txt.append(h, s);
    const btn = document.createElement("button");
    btn.className = "vote";
    btn.textContent = myChoice === m.key ? "✓ 선택함" : "이걸로 할게요";
    btn.disabled = !state.ready || state.busy;
    btn.onclick = () => vote(m.key);
    body.append(txt, btn);
    card.append(photo, body);
    return card;
  }));

  $("total").textContent = state.votes.length + "명 응답";
  $("rows").replaceChildren(...MENUS.map((m) => {
    const voters = state.votes.filter((v) => v.choice === m.key);
    const pct = state.votes.length ? Math.round((voters.length / state.votes.length) * 100) : 0;
    const row = document.createElement("div"); row.className = "row";
    const top = document.createElement("div"); top.className = "row-top";
    const b = document.createElement("b"); b.textContent = m.name;
    const c = document.createElement("span"); c.className = "count"; c.textContent = `${voters.length}명 · ${pct}%`;
    top.append(b, c);
    const bar = document.createElement("div"); bar.className = "bar";
    const fill = document.createElement("i"); fill.style.width = pct + "%"; bar.append(fill);
    const who = document.createElement("div"); who.className = "who";
    who.textContent = voters.map((v) => `${v.name} (${v.dept})` + (v.mine ? " · 나" : "")).join(", ");
    row.append(top, bar, who);
    return row;
  }));
  $("clear").hidden = !myChoice;
}

function readMe() {
  const dept = $("dept").value.trim(), name = $("pname").value.trim();
  $("dept").classList.toggle("missing", !dept);
  $("pname").classList.toggle("missing", !name);
  return { dept, name };
}

let prefilled = false;
async function load() {
  try {
    state.votes = (await rpc("list_votes", { p_voter: voterId })) || [];
    state.ready = true;
    const me = mine();
    if (!prefilled && me) {
      prefilled = true;
      if (!$("dept").value) $("dept").value = me.dept;
      if (!$("pname").value) $("pname").value = me.name;
    }
    if ($("status").classList.contains("warn") || $("status").textContent === "불러오는 중…") setStatus("소속과 성명을 적고 메뉴를 하나 골라 주세요.");
  } catch {
    setStatus("집계를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.", true);
  }
  render();
}

async function vote(key) {
  const { dept, name } = readMe();
  if (!dept || !name) { setStatus("소속과 성명을 먼저 적어 주세요.", true); (!dept ? $("dept") : $("pname")).focus(); return; }
  const cur = mine();
  if (cur && cur.choice === key && cur.dept === dept && cur.name === name) return;
  state.busy = true; render();
  try {
    await rpc("cast_vote", { p_voter: voterId, p_dept: dept, p_name: name, p_choice: key });
    setStatus("저장했어요. 다른 메뉴를 누르면 바뀝니다.");
  } catch { setStatus("저장하지 못했어요. 잠시 후 다시 눌러 주세요.", true); }
  state.busy = false;
  await load();
}

async function saveInfo() {
  const cur = mine();
  if (!cur) return;
  const { dept, name } = readMe();
  if (!dept || !name || (dept === cur.dept && name === cur.name)) return;
  try {
    await rpc("cast_vote", { p_voter: voterId, p_dept: dept, p_name: name, p_choice: cur.choice });
    setStatus("소속과 성명을 수정했어요.");
  } catch { setStatus("소속과 성명을 저장하지 못했어요. 잠시 후 다시 시도해 주세요.", true); }
  await load();
}
$("dept").addEventListener("change", saveInfo);
$("pname").addEventListener("change", saveInfo);

$("clear").onclick = async () => {
  try { await rpc("cancel_vote", { p_voter: voterId }); setStatus("선택을 취소했어요."); }
  catch { setStatus("취소하지 못했어요. 잠시 후 다시 시도해 주세요.", true); }
  await load();
};

render();
load();
// 다른 사람의 투표도 보이도록 15초마다 새로 불러와요
setInterval(() => { if (!document.hidden && !state.busy) load(); }, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
